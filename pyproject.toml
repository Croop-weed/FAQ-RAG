[project]
name = "customer-support-assistant"
version = "0.1.0"
description = "Production-oriented customer support assistant foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "faiss-cpu>=1.10",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2",
    "ollama>=0.6",
    "pydantic-settings>=2.15.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "support_assistant"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
