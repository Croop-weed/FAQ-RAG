[project]
name = "microsoft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harshit Dhaundiyal", email = "harsh.arror@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "faiss-cpu>=1.15.1",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "openai>=3.25.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
microsoft = "microsoft:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
